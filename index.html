<!DOCTYPYE html>
<html>
  <head>
      <title>Student Portal</title>

    <style>
        body  {
            background: #111;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

         .login-box {
             background: #222;
             padding: 30px;
             width: 280px;
             border-radius: 15px;
             text-align: center;
         }

          input {
             width: 90%;
             padding: 10px;
             margin: 8px 0;
             border: none;
             border-radius: 8px;
             box-sizing: border-box;
          }

           button {
             width: 97%;
             padding: 10px;
             margin-top: 10px;
             border: none;
             border-radius: 8px;
             cursor: pointer;
           }
    </style>
  </head>

  <body>

    <div class="login-box">

        <h2>STUDENT PORTAL</h2>

        <input type="text"  id="username" placeholder="Username">

       <input type="password"  id=="password" placeholder="Password">

        <button onclick="login()">Login kaden baby</button>
    </div>

    <script>
       function login() {

         let username = document.getElementById("username").value;
         let password = document.getElementById("password").value;

         if (username === "Bainess" && password === "1234") {
           window.location.href = "dashboard.html";
         } else {
           alert("  Wrong username or password ");
        }
       }
    </script>
  </body>
</html>
